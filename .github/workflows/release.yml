name: Release userscript

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SCRIPT: "ArrActivityQueueSearch.user.js"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and update release info
        run: |
          SCRIPT_VERSION=$(grep -E '^// @version' "$SCRIPT" | awk '{print $3}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Script version: $SCRIPT_VERSION"
          echo "Tag version:    $TAG_VERSION"

          if [ "$SCRIPT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch between script and tag"
            exit 1
          fi

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RAW_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/refs/tags/v${TAG_VERSION}"
          RAW_SCRIPT="${RAW_BASE}/${SCRIPT}"

          # Update userscript
          sed -i "s|<OWNER>|${GITHUB_REPOSITORY_OWNER}|g" "$SCRIPT"
          sed -i "s|<REPO_URL>|${REPO_URL}|g" "$SCRIPT"
          sed -i "s|<RAW_BASE>|${RAW_BASE}|g" "$SCRIPT"
          sed -i "s|<RAW_SCRIPT>|${RAW_SCRIPT}|g" "$SCRIPT"

          # Update bb_* files
          for f in docs/bb_*; do
            if [ -f "$f" ]; then
              sed -i "s|<OWNER>|${GITHUB_REPOSITORY_OWNER}|g" "$f"
              sed -i "s|<REPO_URL>|${REPO_URL}|g" "$f"
              sed -i "s|<RAW_SCRIPT>|${RAW_SCRIPT}|g" "$f"
            fi
          done

          # Update README links to point to release download
          sed -i "s|](${SCRIPT})|](${RAW_SCRIPT})|g" README.md

          echo "Updated release info for v${TAG_VERSION}"

      - name: Commit updated URLs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "$SCRIPT" docs/bb_* README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update URLs for release v${GITHUB_REF_NAME#v}"
            git push
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SCRIPT }}
          generate_release_notes: true